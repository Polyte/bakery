services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dadda
      POSTGRES_PASSWORD: dadda_dev
      POSTGRES_DB: dadda_bakery
    ports:
      - "5434:5432"
    volumes:
      - dadda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dadda -d dadda_bakery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dadda_pg_data:
